name: Marketing

on:
  pull_request:
  push:

jobs:
  marketing:
    name: marketing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Wrangler config
        run: npm run dry-run
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
