name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: typecheck-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma-generate

      - name: Typecheck frontend
        run: pnpm exec tsc -p apps/frontend/tsconfig.json --noEmit

      - name: Typecheck backend and orchestrator
        run: pnpm run typecheck

      - name: Build frontend
        run: pnpm --filter ./apps/frontend run build
