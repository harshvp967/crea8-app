name: Build Railway images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - apps/orchestrator/**
      - libraries/**
      - var/docker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - tsconfig.json
      - tsconfig.base.json
      - Dockerfile
      - .github/workflows/build-railway-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: railway-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A native require that never returns used to sit in "Build and push"
    # until the job was cancelled (over an hour). 20 minutes covers a cold
    # image build; the Dockerfile smoke test itself is capped at 2 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            image: ghcr.io/harshvp967/crea8-app-backend
          - target: orchestrator
            image: ghcr.io/harshvp967/crea8-app-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ matrix.image }}:${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "${{ matrix.image }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/harshvp967/crea8-app
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.target == 'backend' && 'crea8-app-backend' || 'crea8-app-orchestrator' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR packages are often private on first publish even for a public
          # repo. Public images can be pulled by Railway with no registry
          # credential. /user/packages is the token owner. GITHUB_TOKEN is the
          # Actions bot, so that path 404s after a successful push. The image
          # lives under the repository owner. A 403/404 is not fatal: the
          # image is already in GHCR. Flip the package to Public once in
          # GitHub package settings if a pull still needs it.
          if gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/users/${OWNER}/packages/container/${IMAGE_NAME}/visibility" \
            -f visibility=public; then
            echo "Package ${IMAGE_NAME} is public"
          else
            echo "Could not change visibility of ${IMAGE_NAME}. The image was still pushed."
          fi
