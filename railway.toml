# Railpack, which builds the Railway services today, ignores this file.
# The Nixpacks block below is unchanged so a service that is still on
# Nixpacks keeps the same setup packages. It does not affect current
# Railpack builds. Production images are published by
# .github/workflows/build-railway-images.yml.

[phases.setup]
    nixPkgs = ['nodejs', 'python3']
    aptPkgs = ['build-essential', 'libudev-dev']